<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главный экран</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(rgba(5, 17, 34, 0.74), rgba(5, 17, 34, 0.84)),
        url("kristal/assets/hero-4.jpg") center / cover no-repeat,
        #102842;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .screen {
      width: min(980px, 100%);
      display: grid;
      gap: 28px;
    }

    .hero {
      max-width: 720px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.86);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 22px 0 14px;
      font-size: clamp(44px, 10vw, 86px);
      line-height: 0.95;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    p {
      max-width: 560px;
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(17px, 2.4vw, 21px);
      line-height: 1.55;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .button {
      position: relative;
      overflow: hidden;
      min-height: 132px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #071827;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .button:hover {
      transform: translateY(-4px);
      background: #ffffff;
      box-shadow: 0 34px 88px rgba(0, 0, 0, 0.34);
    }

    .button strong {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
      text-transform: uppercase;
    }

    .button span {
      color: #597082;
      font-size: 15px;
      font-weight: 700;
    }

    .button.f9 {
      min-height: 184px;
      padding-right: 170px;
      color: #ffffff;
      background: linear-gradient(135deg, #ef3b2d 0%, #ff8a00 100%);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .button.f9 span {
      color: rgba(255, 255, 255, 0.84);
    }

    .badge {
      width: max-content;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      color: #e53a22;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
    }

    .line {
      display: block;
      margin-top: -10px;
      color: rgba(255, 255, 255, 0.94);
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .product {
      position: absolute;
      right: 14px;
      bottom: 12px;
      width: 138px;
      max-height: 150px;
      object-fit: contain;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.3));
      pointer-events: none;
    }

    .arrow {
      align-self: flex-end;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(7, 24, 39, 0.09);
      font-size: 24px;
      font-weight: 800;
    }

    .f9 .arrow {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 680px) {
      body {
        align-items: start;
        padding: 22px 14px;
      }

      .screen {
        gap: 22px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .button {
        min-height: 112px;
        padding: 20px;
      }

      .button.f9 {
        min-height: 176px;
        padding-right: 126px;
      }

      .product {
        width: 112px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="hero">
      <div class="eyebrow">Главное меню</div>
      <h1>Kristal</h1>
      <p>Выберите нужный сайт и переходите сразу на рабочую страницу.</p>
    </section>

    <nav class="actions" aria-label="Переходы на сайты">
      <a class="button" href="kristal/">
        <strong>Kristal</strong>
        <span>Открыть основной сайт</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="button f9" href="дазпд/f9_2_fixed.html">
        <span class="badge">70% скидка</span>
        <strong>F9</strong>
        <span class="line">Линия 12</span>
        <span>Открыть страницу F9 Fatizon</span>
        <img class="product" src="дазпд/f9_2_files/main.jpg" alt="F9 Fatizon">
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>
  </main>
</body>
</html>
