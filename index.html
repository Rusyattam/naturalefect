<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сайты</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #111827;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --gold: #c79b66;
      --shadow: rgba(15, 23, 42, 0.18);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 54px 0 72px;
    }

    .hero {
      margin-bottom: 36px;
      text-align: center;
      color: #fff;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.6rem, 5vw, 5rem);
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero p {
      margin: 18px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .sites {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .site-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      padding: 26px 18px 20px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-alt) 100%);
      text-align: center;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 14px 30px var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      border: 1px solid rgba(15, 23, 42, 0.06);
    }

    .site-card:hover,
    .site-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 20px 36px rgba(15, 23, 42, 0.2);
      outline: none;
    }

    .number {
      margin-bottom: 12px;
      color: var(--gold);
      font-size: clamp(2.1rem, 3vw, 3.2rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .name {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .url {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.4;
      letter-spacing: 0.02em;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1040px) {
      .sites { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .page { padding-top: 34px; }
      .hero { margin-bottom: 26px; }
      .sites { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .site-card { min-height: 172px; padding: 22px 14px 18px; }
    }

    @media (max-width: 460px) {
      .page { width: min(100% - 20px, 1180px); }
      .sites { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Сайты</h1>
      <p>Выберите проект</p>
    </header>

    <nav class="sites" aria-label="Список сайтов">
      <a class="site-card" href="analist/">
        <span class="number">01</span>
        <h2 class="name">Analist</h2>
        <span class="url">mydomain.com/analist/</span>
      </a>

      <a class="site-card" href="f9/">
        <span class="number">02</span>
        <h2 class="name">F9</h2>
        <span class="url">mydomain.com/f9/</span>
      </a>

      <a class="site-card" href="f9-2/">
        <span class="number">03</span>
        <h2 class="name">F9-2</h2>
        <span class="url">mydomain.com/f9-2/</span>
      </a>

      <a class="site-card" href="kristal/">
        <span class="number">04</span>
        <h2 class="name">Kristal</h2>
        <span class="url">mydomain.com/kristal/</span>
      </a>

      <a class="site-card" href="surer/messages.html">
        <span class="number">05</span>
        <h2 class="name">Surer</h2>
        <span class="url">mydomain.com/surer/messages.html</span>
      </a>

      <a class="site-card" href="https://natural-effect.online/snkece/">
        <span class="number">06</span>
        <h2 class="name">Snake</h2>
        <span class="url">natural-effect.online/snkece/</span>
      </a>

      <a class="site-card" href="https://natural-effect.online/snkecf">
        <span class="number">07</span>
        <h2 class="name">Snake 2</h2>
        <span class="url">natural-effect.online/snkecf</span>
      </a>
    </nav>
  </main>
</body>
</html>
