<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>кристал</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at top right, rgba(76, 201, 255, 0.34), transparent 34%),
        linear-gradient(135deg, #061a3b 0%, #0d47b5 55%, #061a3b 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: min(620px, 100%);
      text-align: center;
      padding: 52px 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 14px;
      background: linear-gradient(145deg, #75e8ff, #1769ff);
      display: grid;
      place-items: center;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 18px 40px rgba(23, 105, 255, 0.35);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(42px, 10vw, 78px);
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    p {
      margin: 0 auto 32px;
      max-width: 430px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      min-height: 56px;
      padding: 0 34px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #061a3b;
      background: #ffffff;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.2);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 46px rgba(0, 0, 0, 0.26);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark">K</div>
    <h1>кристал</h1>
    <p>Главная страница для перехода на сайт кристал.</p>
    <a class="button" href="kristal-5/">кристал</a>
  </main>
</body>
</html>
