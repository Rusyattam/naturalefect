<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайты</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #1d304d;
      --card: #ffffff;
      --gold: #c79b66;
      --text: #080808;
      --muted: #657184;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 72px;
    }

    .hero {
      margin-bottom: 58px;
      text-align: center;
      color: #ffffff;
    }

    .hero h1 {
      margin: 0;
      font-family: Arial, "Segoe UI", sans-serif;
      font-size: clamp(56px, 6vw, 76px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .hero p {
      margin: 23px 0 0;
      color: rgba(255, 255, 255, 0.58);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sites {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 30px;
    }

    .site-card {
      min-height: 198px;
      padding: 34px 20px 30px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: inherit;
      background: var(--card);
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .site-card:hover,
    .site-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
      outline: none;
    }

    .number {
      margin-bottom: 13px;
      color: var(--gold);
      font-family: Arial, "Segoe UI", sans-serif;
      font-size: 52px;
      line-height: 1;
      font-weight: 900;
    }

    .name {
      margin: 0;
      font-size: 21px;
      line-height: 1.12;
      font-weight: 700;
    }

    .url {
      max-width: 100%;
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1040px) {
      .sites {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .page {
        padding-top: 34px;
      }

      .hero {
        margin-bottom: 36px;
      }

      .sites {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .site-card {
        min-height: 168px;
        padding: 26px 16px 22px;
      }

      .number {
        font-size: 44px;
      }

      .name {
        font-size: 18px;
      }
    }

    @media (max-width: 460px) {
      .page {
        width: min(100% - 24px, 1180px);
      }

      .sites {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Сайты</h1>
      <p>Выберите сайт</p>
    </header>

    <nav class="sites" aria-label="Список сайтов">
      <a class="site-card" href="analist/">
        <span class="number">01</span>
        <h2 class="name">Analist</h2>
        <span class="url">mydomain.com/analist/</span>
      </a>

      <a class="site-card" href="f9/">
        <span class="number">02</span>
        <h2 class="name">F9</h2>
        <span class="url">mydomain.com/f9/</span>
      </a>

      <a class="site-card" href="f9-2/">
        <span class="number">03</span>
        <h2 class="name">F9-2</h2>
        <span class="url">mydomain.com/f9-2/</span>
      </a>

      <a class="site-card" href="kristal/">
        <span class="number">04</span>
        <h2 class="name">Kristal</h2>
        <span class="url">mydomain.com/kristal/</span>
      </a>

      <a class="site-card" href="migra-uz.html">
        <span class="number">05</span>
        <h2 class="name">Migra UZ</h2>
        <span class="url">mydomain.com/migra-uz.html</span>
      </a>
    </nav>
  </main>
</body>
</html>
