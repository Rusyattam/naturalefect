<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>natural-effect.online</title>
  <style>
    :root {
      --chrome-bg: #2b2430;
      --browser-bg: #1d232a;
      --page-bg: #1b2128;
      --panel: rgba(255, 255, 255, 0.06);
      --text: #e5e7eb;
      --muted: rgba(226, 232, 240, 0.76);
      --soft: rgba(255, 255, 255, 0.66);
      --primary: #b8c8f3;
      --button: rgba(141, 174, 236, 0.22);
      --button-alt: rgba(255, 255, 255, 0.08);
      --dark-line: rgba(255, 255, 255, 0.08);
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, "Segoe UI", sans-serif;
      background: #0b0d12;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      background:
        linear-gradient(180deg, rgba(152, 112, 130, 0.3), rgba(8, 10, 14, 0.35)),
        linear-gradient(180deg, #0f172a 0%, #1d232d 100%);
      overflow: hidden;
    }

    .window {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: var(--page-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
    }

    .browser-bar {
      height: 42px;
      background: var(--chrome-bg);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 8px 12px;
      gap: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.14);
    }

    .browser-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .control {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      opacity: 0.7;
      display: inline-block;
    }

    .control.red { background: #f87171; }
    .control.yellow { background: #fbbf24; }
    .control.green { background: #34d399; }

    .toolbar {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .address-bar {
      width: min(100%, 760px);
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px 0 10px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.84);
      gap: 8px;
      overflow: hidden;
    }

    .lock {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 2px;
      position: relative;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .lock::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 6px;
      border: 2px solid rgba(255,255,255,0.7);
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      left: 50%;
      transform: translateX(-50%);
      top: -7px;
    }

    .url {
      font-size: 12px;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255,255,255,0.8);
    }

    .browser-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .star,
    .menu {
      position: relative;
      width: 14px;
      height: 14px;
      opacity: 0.8;
    }

    .star::before {
      content: "★";
      position: absolute;
      inset: 0;
      font-size: 14px;
      line-height: 14px;
      color: rgba(255,255,255,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu {
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.32);
      width: 16px;
      height: 16px;
    }

    .menu::before {
      content: "K";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: rgba(255,255,255,0.72);
      font-weight: 700;
    }

    .page-body {
      position: relative;
      flex: 1;
      background: linear-gradient(180deg, rgba(18,24,31,0.9) 0%, rgba(18,24,31,0.75) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    .page-body::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 120px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.18));
      pointer-events: none;
    }

    .desktop-strip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      background: rgba(34, 35, 38, 0.86);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      letter-spacing: 0.08em;
      opacity: 0.7;
    }

    .error-card {
      position: relative;
      z-index: 1;
      width: min(560px, calc(100% - 40px));
      text-align: center;
      color: var(--text);
    }

    .doc-icon {
      width: 56px;
      height: 64px;
      position: relative;
      margin: 0 auto 24px;
      border: 2px solid rgba(255,255,255,0.65);
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
      opacity: 0.75;
    }

    .doc-icon::before {
      content: "";
      position: absolute;
      top: -2px;
      right: -2px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.04);
      border-left: 2px solid rgba(255,255,255,0.65);
      border-bottom: 2px solid rgba(255,255,255,0.65);
      transform: skew(-20deg);
      border-radius: 0 0 0 10px;
    }

    .doc-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 44%;
      width: 18px;
      height: 12px;
      transform: translate(-50%, -50%);
      border-top: 2px solid rgba(255,255,255,0.7);
      border-bottom: 2px solid rgba(255,255,255,0.7);
      border-radius: 1px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2.1vw, 2.1rem);
      line-height: 1.3;
      font-weight: 500;
      color: rgba(255,255,255,0.96);
    }

    .subhead {
      margin-top: 14px;
      font-size: 1.05rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.5;
    }

    .tips {
      margin-top: 18px;
      color: rgba(255,255,255,0.72);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .tips strong {
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }

    .tips ul {
      margin: 0;
      padding-left: 22px;
      list-style: disc;
      text-align: left;
      display: inline-block;
    }

    .error-code {
      margin-top: 12px;
      color: #8ab1ff;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .button {
      min-width: 150px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    .button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .button.primary {
      background: rgba(155, 187, 255, 0.85);
      color: #101827;
      box-shadow: 0 4px 12px rgba(125, 153, 226, 0.34);
    }

    .button.secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.18);
    }

    @media (max-width: 640px) {
      .browser-bar {
        padding-inline: 10px;
      }

      .browser-controls {
        gap: 8px;
      }

      .address-bar {
        width: 100%;
      }

      .error-card {
        width: min(90vw, 420px);
      }

      .actions {
        gap: 12px;
      }

      .button {
        min-width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="window" role="presentation">
    <header class="browser-bar" aria-label="Браузер">
      <div class="browser-controls" aria-hidden="true">
        <span class="control red"></span>
        <span class="control yellow"></span>
        <span class="control green"></span>
      </div>

      <div class="toolbar">
        <div class="address-bar" aria-label="Адрес страницы">
          <span class="lock" aria-hidden="true"></span>
          <span class="url">natural-effect.online</span>
        </div>
      </div>

      <div class="browser-tools" aria-hidden="true">
        <span class="star"></span>
        <span class="menu"></span>
      </div>
    </header>

    <main class="page-body">
      <section class="error-card" aria-live="polite">
        <div class="doc-icon" aria-hidden="true"></div>
        <h1>Не удается получить доступ к сайту</h1>
        <div class="subhead">Соединение сброшено.</div>

        <div class="tips">
          <strong>Попробуйте сделать следующее:</strong>
          <ul>
            <li>Проверьте подключение к интернету.</li>
            <li>Проверьте настройки прокси-сервера и брандмауэра.</li>
            <li>Выполните диагностику сети в Windows.</li>
          </ul>
        </div>

        <div class="error-code">ERR_CONNECTION_RESET</div>

        <div class="actions">
          <button class="button primary" type="button">Перезагрузить</button>
          <button class="button secondary" type="button">Сведения</button>
        </div>
      </section>

      <div class="desktop-strip" aria-hidden="true">Desktop</div>
    </main>
  </div>
</body>
</html>
