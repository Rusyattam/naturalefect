<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>кристал</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      background: #1f2f46;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 14px;
    }

    .logo {
      font-family: Arial, sans-serif;
      font-size: clamp(38px, 13vw, 56px);
      font-weight: 900;
      color: white;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-align: center;
    }

    .tagline {
      font-size: 16px;
      opacity: 0.75;
      margin-bottom: 42px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 16px;
      width: min(980px, 100%);
    }

    .card {
      background: white;
      color: #222;
      padding: 30px 40px;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      transition: transform 0.2s;
      min-width: 140px;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card .num {
      font-size: 42px;
      font-weight: 900;
      color: #1d559e;
      font-family: Arial, sans-serif;
    }

    .card .name {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    @media (max-width: 520px) {
      body {
        justify-content: flex-start;
      }

      .tagline {
        margin-bottom: 24px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card {
        min-width: 0;
        padding: 20px 8px;
      }

      .card .num {
        font-size: 32px;
      }

      .card .name {
        font-size: 11px;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <div class="logo">кристал</div>
  <div class="tagline">линия</div>
  <div class="grid">
    <a href="1/" class="card"><div class="num">1</div><div class="name">/kristal/1/</div></a>
    <a href="4/" class="card"><div class="num">4</div><div class="name">/kristal/4/</div></a>
    <a href="5/" class="card"><div class="num">5</div><div class="name">/kristal/5/</div></a>
    <a href="9/" class="card"><div class="num">9</div><div class="name">/kristal/9/</div></a>
    <a href="10/" class="card"><div class="num">10</div><div class="name">/kristal/10/</div></a>
    <a href="12/" class="card"><div class="num">12</div><div class="name">/kristal/12/</div></a>
    <a href="13/" class="card"><div class="num">13</div><div class="name">/kristal/13/</div></a>
    <a href="14/" class="card"><div class="num">14</div><div class="name">/kristal/14/</div></a>
    <a href="18/" class="card"><div class="num">18</div><div class="name">/kristal/18/</div></a>
    <a href="19/" class="card"><div class="num">19</div><div class="name">/kristal/19/</div></a>
  </div>
</body>
</html>
