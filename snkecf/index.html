<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Выберите линию</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #111827;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --gold: #c79b66;
      --shadow: rgba(15, 23, 42, 0.18);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }
    body {
      min-height: 100vh;
      color: #fff;
      font-family: Arial, "Segoe UI", sans-serif;
    }
    .page {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 54px 0 72px;
    }
    .hero { margin-bottom: 36px; text-align: center; }
    .hero h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero p {
      margin: 18px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .sites {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
    .site-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      padding: 26px 18px 20px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-alt) 100%);
      text-align: center;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 14px 30px var(--shadow);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .site-card:hover, .site-card:focus-visible {
      transform: translateY(-4px);
      outline: none;
    }
    .number {
      color: var(--gold);
      font-size: clamp(3rem, 6vw, 4.4rem);
      line-height: 1;
      font-weight: 900;
    }
    .name { margin: 12px 0 0; font-size: 1.2rem; font-weight: 700; }
    @media (max-width: 560px) {
      .page { padding-top: 34px; }
      .sites { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Линия</h1>
      <p>Выберите 4 или 18</p>
    </header>
    <nav class="sites" aria-label="Выбор линии">
      <a class="site-card" href="4/">
        <span class="number">4</span>
        <h2 class="name">Линия 4</h2>
      </a>
      <a class="site-card" href="18/">
        <span class="number">18</span>
        <h2 class="name">Линия 18</h2>
      </a>
    </nav>
  </main>
</body>
</html>
